<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyLM Playground</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --card:#1c1917; --line:#292524; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  textarea { width:100%; min-height:80px; resize:vertical; font:inherit; color:inherit; background:transparent;
             border:1px solid var(--line); border-radius:8px; padding:10px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:end; margin-top:12px; }
  label { font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  input[type=number] { width:90px; font:inherit; color:inherit; background:transparent; border:1px solid var(--line);
                       border-radius:6px; padding:4px 6px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 18px; font:inherit;
           cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #out { white-space: pre-wrap; margin-top: 16px; min-height: 120px; }
  #out .prompt { color: var(--muted); }
  #stats { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<main>
  <h1>TinyLM Playground</h1>
  <p class="sub">A ~17M-parameter Transformer trained from scratch on TinyStories. Tokens stream from the server via SSE.</p>
  <div class="card">
    <textarea id="prompt">Once upon a time, there was a little robot who</textarea>
    <div class="row">
      <label>max tokens <input id="max" type="number" value="200" min="1" max="1024"></label>
      <label>temperature <input id="temp" type="number" value="0.8" step="0.1" min="0" max="2"></label>
      <label>top-p <input id="topp" type="number" value="0.9" step="0.05" min="0.05" max="1"></label>
      <button id="go">Generate</button>
    </div>
    <div id="out"></div>
    <div id="stats"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("go").onclick = async () => {
  const prompt = $("prompt").value;
  const out = $("out"); out.innerHTML = "";
  const p = document.createElement("span"); p.className = "prompt"; p.textContent = prompt; out.appendChild(p);
  const gen = document.createTextNode(""); out.appendChild(gen);
  $("go").disabled = true; $("stats").textContent = "";
  const t0 = performance.now(); let first = null;
  try {
    const res = await fetch("/v1/generate/stream", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({prompt, max_new_tokens: +$("max").value, temperature: +$("temp").value, top_p: +$("topp").value}),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const evt = buf.slice(0, i); buf = buf.slice(i + 2);
        const data = evt.split("\n").find(l => l.startsWith("data: "))?.slice(6);
        if (!data) continue;
        if (evt.startsWith("event: done")) {
          const s = JSON.parse(data);
          $("stats").textContent = `${s.num_pieces} tokens · first token ${first} ms · total ${s.latency_ms} ms`;
        } else {
          if (first === null) first = Math.round(performance.now() - t0);
          gen.textContent += JSON.parse(data).delta;
        }
      }
    }
  } catch (e) { $("stats").textContent = "Error: " + e.message; }
  $("go").disabled = false;
};
</script>
</body>
</html>
