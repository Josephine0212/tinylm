name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --group dev --extra serve
      - name: Lint
        run: uv run ruff check tinylm scripts server
      - name: Test
        run: uv run pytest -q
      - name: Smoke-train end to end
        run: make smoke
