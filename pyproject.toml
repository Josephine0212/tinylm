[project]
name = "tinylm"
version = "0.1.0"
description = "A GPT-style language model built from scratch in PyTorch: BPE tokenizer, Transformer, AdamW, training, and a streaming inference API."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8",
    "numpy>=2.0",
    "regex>=2024.0",
    "torch>=2.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jaxtyping>=0.2.36",
    "matplotlib>=3.9",
    "psutil>=6",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "tiktoken>=0.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinylm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "WARNING"
timeout = 300

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = ["F722"]

# CPU-only torch wheels on Linux (CI) keep installs small; macOS uses the default PyPI wheel (with MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
